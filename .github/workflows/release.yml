name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DeLNK Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build All Binaries
        run: |
          mkdir -p bin

          echo "==> Building 64-bit GUI (delnk-x64.exe)..."
          x86_64-w64-mingw32-windres -i res/resources-x64.rc -I res -O coff -o bin/rsc-x64.o
          x86_64-w64-mingw32-g++ src/main.cpp bin/rsc-x64.o -o bin/delnk-x64.exe \
            -mwindows -lgdi32 -ladvapi32 -lshell32 -nostartfiles -e WinMainCRTStartup \
            -Os -s -fno-exceptions -fno-rtti -ffunction-sections -fdata-sections -Wl,--gc-sections

          echo "==> Building 64-bit CLI (delnk-cli-x64.exe)..."
          x86_64-w64-mingw32-windres -i res/resources-cli-x64.rc -I res -O coff -o bin/rsc-cli-x64.o
          x86_64-w64-mingw32-g++ src/cli.cpp bin/rsc-cli-x64.o -o bin/delnk-cli-x64.exe \
            -mconsole -ladvapi32 -lshell32 -nostartfiles -e mainCRTStartup \
            -Os -s -fno-exceptions -fno-rtti -ffunction-sections -fdata-sections -Wl,--gc-sections

          echo "==> Building 32-bit GUI (delnk-x32.exe)..."
          i686-w64-mingw32-windres -i res/resources-x32.rc -I res -O coff -o bin/rsc-x32.o
          i686-w64-mingw32-g++ src/main.cpp bin/rsc-x32.o -o bin/delnk-x32.exe \
            -mwindows -lgdi32 -ladvapi32 -lshell32 -nostartfiles -e _WinMainCRTStartup@0 \
            -Os -s -fno-exceptions -fno-rtti -ffunction-sections -fdata-sections -static-libgcc -Wl,--gc-sections

          echo "==> Building 32-bit CLI (delnk-cli-x32.exe)..."
          i686-w64-mingw32-windres -i res/resources-cli-x32.rc -I res -O coff -o bin/rsc-cli-x32.o
          i686-w64-mingw32-g++ src/cli.cpp bin/rsc-cli-x32.o -o bin/delnk-cli-x32.exe \
            -mconsole -ladvapi32 -lshell32 -nostartfiles -e _mainCRTStartup@0 \
            -Os -s -fno-exceptions -fno-rtti -ffunction-sections -fdata-sections -static-libgcc -Wl,--gc-sections

          # Remove temporary object files
          rm -f bin/*.o

          echo "==> Compilation complete. Generated binaries:"
          ls -lh bin/

      - name: Generate SHA-256 Checksums
        run: |
          cd bin
          sha256sum delnk-x64.exe delnk-x32.exe delnk-cli-x64.exe delnk-cli-x32.exe > SHA256SUMS.txt
          echo "==> SHA-256 Checksums:"
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: delnk-binaries
          path: |
            bin/delnk-x64.exe
            bin/delnk-x32.exe
            bin/delnk-cli-x64.exe
            bin/delnk-cli-x32.exe
            bin/SHA256SUMS.txt

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/delnk-x64.exe
            bin/delnk-x32.exe
            bin/delnk-cli-x64.exe
            bin/delnk-cli-x32.exe
            bin/SHA256SUMS.txt
          generate_release_notes: true
